# Offline mode (default, no GPU):        docker compose up --build
# Real mode (GPU, Qwen2.5-VL via vLLM):  docker compose --profile gpu up --build
services:
  medrag:
    build:
      context: .
      args:
        EXTRAS: ${MEDRAG_EXTRAS:-}
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes: [medrag-data:/data]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: [gpu]
    volumes: [qdrant-data:/qdrant/storage]

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [gpu]
    command: ["--model", "Qwen/Qwen2.5-VL-7B-Instruct", "--port", "8001", "--max-model-len", "16384",
              "--limit-mm-per-prompt", "image=1"]
    ports: ["8001:8001"]
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  medrag-data:
  qdrant-data:
  hf-cache:
